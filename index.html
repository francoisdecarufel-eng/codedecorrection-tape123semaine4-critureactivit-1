                            {/* Étape 3 */}
                            <div className="bg-blue-50 rounded-3xl p-8 border-4 border-blue-200 flex flex-col items-center text-center shadow-md">
                                <div className="bg-blue-400 text-white w-20 h-20 rounded-full flex items-center justify-center text-4xl font-extrabold mb-6 shadow-lg border-4 border-white">3</div>
                                <h3 className="text-2xl font-bold text-blue-900 mb-4">Accords (Lunettes)</h3>
                                <p className="text-blue-800 flex-1 text-lg leading-relaxed">Je touche le <strong>Noyau</strong> (chef) pour lier le déterminant et les terminaisons (en partant de la fin du nom).</p>
                                
                                <div className="mt-6 w-full relative flex items-center justify-center bg-white rounded-xl border border-blue-200 pt-12 pb-4">
                                    <div className="text-2xl font-bold -mb-10">
                                        <GNBlock 
                                            words={exampleGNWords}
                                            currentStep={3}
                                            selectedStep1={[]}
                                            selectedStep2={['ex1', 'ex2', 'ex3']}
                                            selectedStep3={['exGN']}
                                            onWordClick={() => {}}
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="mt-16 mb-4">
                            <button 
                                onClick={onStartSimulator}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-extrabold py-5 px-12 rounded-full shadow-2xl hover:shadow-indigo-500/50 transform transition hover:-translate-y-1 active:scale-95 flex items-center gap-4 bounce-slight"
                            >
                                <Icon name="play" className="w-10 h-10" />
                                Démarrer l'entraînement
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Word = ({ word, currentStep, selectedStep1, selectedStep2, isLunettesActive, registerNoun, registerDet, registerEnd }) => {
            const isSelectedStep2 = selectedStep2.includes(word.id);
            const isSelectedStep1Cap = selectedStep1.includes(`${word.id}-cap`);
            const isSelectedStep1Punc = selectedStep1.includes(`${word.id}-punc`);

            // Résolution des couleurs de fond
            let containerClass = "inline-flex items-baseline mx-1 px-1 rounded-xl transition-all duration-300 relative ";
            
            if (currentStep >= 2) {
                if (isSelectedStep2) {
                    containerClass += "bg-emerald-200 shadow-sm "; // Vert si sélectionné dans le GN
                } else {
                    containerClass += "bg-transparent ";
                }
            }

            // Gestion de l'apparence des lunettes (Step 3 validé ou en cours)
            const isCircledDet = isLunettesActive && word.role === 'det';
            const isCircledEnd = isLunettesActive && word.end !== '' && word.role === 'adj';
            const isNoyauText = isLunettesActive && word.role === 'noun';

            const isNoun = word.role === 'noun';
            const isAdj = word.role === 'adj';
            const isDet = word.role === 'det';

            return (
                <span className={containerClass}>
                    
                    {/* MAJUSCULE */}
                    {word.cap && (
                        <span 
                            data-part={`${word.id}-cap`}
                            className={`target-part font-medium ${currentStep === 1 ? (isSelectedStep1Cap ? 'selected-step1' : '') : (isSelectedStep2 ? 'text-emerald-900 font-bold' : 'text-gray-800')}`}
                        >
                            {word.cap}
                        </span>
                    )}

                    {/* MOT PRINCIPAL (Déterminant, Nom, Adjectif ou Autre) */}
                    {isDet ? (
                        <span ref={registerDet} className={`transition-all duration-500 font-medium ${isCircledDet ? 'circled-lunette' : (isSelectedStep2 ? 'text-emerald-900 font-bold' : 'text-gray-800')}`}>
                            {word.body}{word.end}
                        </span>
                    ) : isNoun ? (
                        <span className={`${isNoyauText ? 'noyau-active' : ''} inline-flex items-baseline transition-colors duration-300 rounded`}>
                            <span 
                                ref={!word.end ? registerNoun : null} 
                                className={`font-medium ${isSelectedStep2 ? 'text-emerald-900 font-bold' : 'text-gray-800'}`}
                            >
                                {word.body}
                            </span>
                            {word.end && (
                                <span 
                                    ref={registerNoun} 
                                    className={`font-medium ${isSelectedStep2 ? 'text-emerald-900 font-bold' : 'text-gray-800'}`}
                                >
                                    {word.end}
                                </span>
                            )}
                        </span>
                    ) : (
                        <span className="inline-flex items-baseline">
                            <span 
                                ref={(!word.end && isAdj) ? registerEnd : null} 
                                className={`font-medium ${isSelectedStep2 ? 'text-emerald-900 font-bold' : 'text-gray-800'}`}
                            >
                                {word.body}
                            </span>
                            {word.end && (
                                <span 
                                    ref={isAdj ? registerEnd : null} 
                                    className={`font-medium transition-all duration-500 ${isCircledEnd ? 'circled-lunette' : (isSelectedStep2 ? 'text-emerald-900 font-bold' : 'text-gray-800')}`}
                                >
                                    {word.end}
                                </span>
                            )}
                        </span>
                    )}

                    {/* PONCTUATION */}
                    {word.punc && (
                        <span 
                            data-part={`${word.id}-punc`}
                            className={`target-part font-medium ${currentStep === 1 ? (isSelectedStep1Punc ? 'selected-step1' : '') : 'text-gray-800'}`}
                        >
                            {word.punc}
                        </span>
                    )}
                </span>
            );
        };

        const GNBlock = ({ words, currentStep, selectedStep1, selectedStep2, selectedStep3, onWordClick }) => {
            const containerRef = useRef(null);
            const detRef = useRef(null);
            const nounRef = useRef(null);
            const endRefs = useRef(new Map());
            const [paths, setPaths] = useState([]);

            const firstWordId = words[0].id;
            const lastWordId = words[words.length - 1].id;
            
            // Un GN est pleinement sélectionné si TOUS ses mots sont dans selectedStep2
            const isFullySelected = words.every(w => selectedStep2.includes(w.id));
            
            // Le noyau a-t-il été cliqué pour ce GN (Activation des lunettes)
            const gnId = words[0].gn;
            const isLunettesActive = selectedStep3.includes(gnId);

            useLayoutEffect(() => {
                if (isLunettesActive && containerRef.current && nounRef.current) {
                    const updatePaths = () => {
                        if (!containerRef.current || !nounRef.current) return;

                        const cRect = containerRef.current.getBoundingClientRect();
                        const nRect = nounRef.current.getBoundingClientRect();
                        
                        // Point de départ: milieu haut de la terminaison du noyau (ou du mot s'il n'a pas de terminaison)
                        const startX = nRect.left - cRect.left + (nRect.width / 2);
                        const startY = nRect.top - cRect.top - 2;

                        let newPaths = [];
                        
                        const drawArcOver = (targetRect) => {
                            if (!targetRect) return null;
                            // Point d'arrivée: milieu haut de la cible
                            const endX = targetRect.left - cRect.left + (targetRect.width / 2);
                            const endY = targetRect.top - cRect.top - 2;
                            
                            const minX = Math.min(startX, endX);
                            const maxX = Math.max(startX, endX);
                            const distanceX = maxX - minX;

                            const highestY = Math.min(startY, endY);
                            // Hauteur dynamique de l'arc (proportionnelle à l'écartement)
                            const controlY = highestY - Math.max(25, distanceX * 0.2);

                            return `M ${startX} ${startY} Q ${startX + (endX - startX)/2} ${controlY} ${endX} ${endY}`;
                        };

                        // Tracer vers le déterminant
                        if (detRef.current) {
                            const path = drawArcOver(detRef.current.getBoundingClientRect());
                            if(path) newPaths.push(path);
                        }

                        // Tracer vers toutes les terminaisons d'adjectifs
                        endRefs.current.forEach((el) => {
                            if (el && el !== nounRef.current) {
                                const path = drawArcOver(el.getBoundingClientRect());
                                if(path) newPaths.push(path);
                            }
                        });

                        setPaths(newPaths);
                    };

                    // Exécuter et lier au redimensionnement
                    updatePaths();
                    window.addEventListener('resize', updatePaths);
                    return () => window.removeEventListener('resize', updatePaths);
                } else {
                    setPaths([]); // Effacer si inactif
                }
            }, [isLunettesActive, words]);

            return (
                <span ref={containerRef} className="relative inline-flex items-baseline mx-1 rounded-xl transition-all mb-10 whitespace-nowrap">
                    
                    {/* Crochet d'ouverture [ */}
                    <span className={`text-emerald-500 font-extrabold text-3xl sm:text-5xl transition-all duration-300 flex items-center justify-center mr-1 ${isFullySelected ? 'opacity-100 scale-100 w-auto' : 'opacity-0 scale-50 w-0 overflow-hidden'}`}>
                        [
                    </span>

                    {/* Mots du GN */}
                    {words.map(w => (
                        <span key={w.id} onClick={(e) => onWordClick(w, e)} className={currentStep >= 2 ? "cursor-pointer" : ""}>
                            <Word 
                                word={w} 
                                currentStep={currentStep}
                                selectedStep1={selectedStep1}
                                selectedStep2={selectedStep2}
                                isLunettesActive={isLunettesActive}
                                registerDet={(el) => { detRef.current = el; }}
                                registerNoun={(el) => { nounRef.current = el; }}
                                registerEnd={(el) => {
                                    if (el) {
                                        endRefs.current.set(w.id, el);
                                    } else {
                                        endRefs.current.delete(w.id);
                                    }
                                }}
                            />
                        </span>
                    ))}

                    {/* Crochet de fermeture ] */}
                    <span className={`text-emerald-500 font-extrabold text-3xl sm:text-5xl transition-all duration-300 flex items-center justify-center ml-1 ${isFullySelected ? 'opacity-100 scale-100 w-auto' : 'opacity-0 scale-50 w-0 overflow-hidden'}`}>
                        ]
                    </span>

                    {/* Couche SVG pour les lunettes (par-dessus) */}
                    {isLunettesActive && (
                        <svg className="absolute top-0 left-0 w-full h-full pointer-events-none z-30" style={{overflow: 'visible'}}>
                            {paths.map((p, i) => (
                                <path 
                                    key={i} 
                                    d={p} 
                                    className="path-draw"
                                    fill="transparent" 
                                    stroke="#3b82f6" 
                                    strokeWidth="4" 
                                    strokeLinecap="round"
                                    strokeLinejoin="round"
                                />
                            ))}
                        </svg>
                    )}
                </span>
            );
        };

        const SimulatorTab = ({ onFinish }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [currentStep, setCurrentStep] = useState(1);
            
            // États de sélection stricts et isolés
            const [selectedStep1, setSelectedStep1] = useState([]); // ex: ['0-cap', '6-punc']
            const [selectedStep2, setSelectedStep2] = useState([]); // ex: [0, 1, 2]
            const [selectedStep3, setSelectedStep3] = useState([]); // ex: [1] (gnIds validés)
            
            const [feedback, setFeedback] = useState({ status: 'idle', message: '' }); // idle, correct, incorrect, hint
            const [showReflection, setShowReflection] = useState(false);

            const currentData = SENTENCES_DATA[currentIndex];
            const isCompleted = currentIndex >= SENTENCES_DATA.length;

            if (isCompleted) {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-8 slide-up text-center w-full min-h-full overflow-y-auto">
                        <div className="bg-white p-12 rounded-3xl shadow-2xl border-8 border-emerald-400 max-w-3xl w-full">
                            <Icon name="star" className="w-32 h-32 text-amber-400 mx-auto mb-8 bounce-slight" />
                            <h2 className="text-5xl font-extrabold text-gray-800 mb-6">Incroyable !</h2>
                            <p className="text-2xl text-gray-600 mb-10 leading-relaxed">
                                Tu as complété avec succès toutes les phrases de l'histoire. Le code de correction n'a plus de secret pour toi !
                            </p>
                            <button 
                                onClick={onFinish}
                                className="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white text-3xl font-extrabold py-6 px-12 rounded-full shadow-2xl transform transition hover:scale-105 active:scale-95 flex items-center justify-center gap-4 mx-auto"
                            >
                                <Icon name="refresh" className="w-10 h-10" />
                                Recommencer
                            </button>
                        </div>
                    </div>
                );
            }

            // --- GESTIONNAIRES DE CLIC SÉCURISÉS ---
            const handleWordClick = (word, e) => {
                if (feedback.status === 'correct') return; // Bloqué si réussi

                // Étape 1 : On délègue au clic sur les balises de span cibles (cap / punc)
                if (currentStep === 1) {
                    const target = e.target;
                    const partStr = target.getAttribute('data-part');
                    if (partStr) {
                        setSelectedStep1(prev => 
                            prev.includes(partStr) ? prev.filter(p => p !== partStr) : [...prev, partStr]
                        );
                        setFeedback({ status: 'idle', message: '' });
                    }
                    return;
                }

                // Étape 2 : On sélectionne le mot entier
                if (currentStep === 2) {
                    setSelectedStep2(prev => 
                        prev.includes(word.id) ? prev.filter(id => id !== word.id) : [...prev, word.id]
                    );
                    setFeedback({ status: 'idle', message: '' });
                    return;
                }

                // Étape 3 : On clique sur un NOM pour activer ses lunettes
                if (currentStep === 3) {
                    // Vérifier si c'est un noyau valide dans cette phrase
                    if (currentData.step3.includes(word.id)) {
                        setSelectedStep3(prev => {
                            if (!prev.includes(word.gn)) {
                                const newVal = [...prev, word.gn];
                                // Si tous les GNs sont activés, on valide automatiquement
                                if (newVal.length === currentData.step3.length) {
                                    setFeedback({ status: 'correct', message: "Fantastique ! Tu as dessiné toutes les lunettes d'accord." });
                                }
                                return newVal;
                            }
                            return prev;
                        });
                    } else {
                        // Clic sur un mauvais mot
                        setFeedback({ status: 'incorrect', message: "Ce mot n'est pas le noyau (chef) du groupe du nom. Cherche le NOM." });
                    }
                }
            };

            const arraysEqual = (a, b) => {
                if (!a || !b) return false;
                if (a.length !== b.length) return false;
                const sortedA = [...a].sort();
                const sortedB = [...b].sort();
                return sortedA.every((val, index) => val === sortedB[index]);
            };

            const verifyStep = () => {
                if (currentStep === 1) {
                    if (arraysEqual(selectedStep1, currentData.step1)) {
                        setFeedback({ status: 'correct', message: "Excellent ! Tu as repéré la majuscule et la ponctuation." });
                    } else {
                        setFeedback({ status: 'incorrect', message: "Attention, as-tu bien touché la première lettre ET le point/virgule final ?" });
                    }
                } else if (currentStep === 2) {
                    const expectedWords = currentData.step2.flat();
                    if (arraysEqual(selectedStep2, expectedWords)) {
                        setFeedback({ status: 'correct', message: "Parfait ! Les groupes du nom sont bien encadrés." });
                    } else {
                        setFeedback({ status: 'incorrect', message: "Il manque des mots ou tu en as sélectionné en trop. N'oublie pas le déterminant, l'adjectif et le nom !" });
                    }
                }
                // Step 3 est auto-validé au clic
            };

            const showHint = () => {
                let hint = "";
                if (currentStep === 1) hint = `Il y a ${currentData.step1.length} éléments à trouver (majuscule(s) et ponctuation).`;
                if (currentStep === 2) hint = `Il y a ${currentData.step2.length} Groupe(s) du Nom à encadrer dans cette phrase.`;
                if (currentStep === 3) hint = `Touche le NOM dans chaque cadre vert pour faire apparaître les lunettes.`;
                setFeedback({ status: 'hint', message: hint });
            };

            const handleNext = () => {
                if (currentStep < 3) {
                    setCurrentStep(prev => prev + 1);
                    setFeedback({ status: 'idle', message: '' });
                } else if (currentStep === 3) {
                    // Afficher la réflexion
                    setShowReflection(true);
                }
            };

            const handleCompleteReflection = () => {
                setShowReflection(false);
                // RÉINITIALISATION TOTALE pour la phrase suivante
                setSelectedStep1([]);
                setSelectedStep2([]);
                setSelectedStep3([]);
                setFeedback({ status: 'idle', message: '' });
                setCurrentStep(1);
                setCurrentIndex(prev => prev + 1);
            };

            // Pour grouper visuellement les GNs :
            const renderSentence = () => {
                const elements = [];
                let i = 0;
                const words = currentData.words;

                while (i < words.length) {
                    const w = words[i];
                    
                    // Si le mot appartient à un GN, on groupe tous les mots de ce GN
                    if (w.gn !== null) {
                        const gnWords = words.filter(word => word.gn === w.gn);
                        elements.push(
                            <GNBlock 
                                key={`gn-${w.gn}`} 
                                words={gnWords}
                                currentStep={currentStep}
                                selectedStep1={selectedStep1}
                                selectedStep2={selectedStep2}
                                selectedStep3={selectedStep3}
                                onWordClick={handleWordClick}
                            />
                        );
                        i += gnWords.length; // Sauter les mots déjà groupés
                    } else {
                        // Mot isolé
                        elements.push(
                            <span 
                                key={`word-${w.id}`} 
                                className={`inline-flex items-baseline mx-1 px-1 mb-10 ${currentStep === 1 ? 'step1-active' : ''}`}
                                onClick={(e) => handleWordClick(w, e)}
                            >
                                <Word 
                                    word={w} 
                                    currentStep={currentStep}
                                    selectedStep1={selectedStep1}
                                    selectedStep2={selectedStep2}
                                    isLunettesActive={false}
                                />
                            </span>
                        );
                        i++;
                    }
                }
                return elements;
            };

            let stepTitle = "";
            let stepDesc = "";
            if (currentStep === 1) { stepTitle = "Étape 1 : Ponctuation"; stepDesc = "Touche la Majuscule du début et la ponctuation finale."; }
            if (currentStep === 2) { stepTitle = "Étape 2 : Groupes du Nom (GN)"; stepDesc = "Touche TOUS les mots de chaque Groupe du Nom pour les encadrer."; }
            if (currentStep === 3) { stepTitle = "Étape 3 : Accords (Lunettes)"; stepDesc = "Touche le NOM NOYAU dans les cadres verts pour tracer tes lunettes !"; }

            return (
                <div className="flex-1 flex flex-col w-full min-h-full relative bg-slate-50">
                    
                    {/* Header Pédagogique */}
                    <div className="bg-white px-6 py-4 shadow-sm z-10 flex flex-col sm:flex-row items-center justify-between border-b-2 border-indigo-100">
                        <div className="font-bold text-xl text-indigo-800 bg-indigo-50 px-4 py-2 rounded-xl mb-4 sm:mb-0 border border-indigo-100">
                            Phrase {currentIndex + 1} / {SENTENCES_DATA.length}
                        </div>
                        
                        <div className="flex gap-4">
                            {[1, 2, 3].map(step => (
                                <div key={step} className={`flex items-center justify-center w-12 h-12 rounded-full font-bold text-xl shadow-md transition-all ${
                                    currentStep === step ? 'bg-indigo-600 text-white scale-110 ring-4 ring-indigo-200' : 
                                    currentStep > step ? 'bg-emerald-500 text-white' : 'bg-gray-200 text-gray-500'
                                }`}>
                                    {currentStep > step ? <Icon name="check" className="w-7 h-7" /> : step}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Zone de Lecture et d'Action */}
                    <div className="flex-1 overflow-y-auto p-4 sm:p-10 flex flex-col items-center">
                        <div className="w-full max-w-6xl">
                            <div className="bg-white rounded-[2.5rem] shadow-xl p-8 sm:p-16 min-h-[400px] border-4 border-white flex flex-col">
                                
                                <div className="text-center mb-16">
                                    <h3 className="text-3xl sm:text-4xl font-extrabold text-indigo-900 mb-4">{stepTitle}</h3>
                                    <p className="text-xl sm:text-2xl text-gray-600 font-medium">{stepDesc}</p>
                                </div>

                                {/* Le Rendu du texte interactif */}
                                <div className={`text-4xl sm:text-6xl leading-[5rem] sm:leading-[7rem] text-center font-medium ${currentStep === 1 ? 'step1-active' : ''}`}>
                                    {renderSentence()}
                                </div>

                            </div>
                        </div>
                    </div>

                    {/* Panneau de Feedback et d'Action du bas */}
                    <div className="bg-white border-t-2 border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] p-6 z-20">
                        <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
                            
                            <div className={`flex-1 w-full rounded-2xl p-6 flex items-center gap-6 transition-all ${
                                feedback.status === 'idle' ? 'bg-indigo-50 text-indigo-800 border-2 border-indigo-100' :
                                feedback.status === 'correct' ? 'bg-emerald-100 text-emerald-900 border-2 border-emerald-400' :
                                feedback.status === 'incorrect' ? 'bg-red-50 text-red-900 border-2 border-red-300' :
                                'bg-amber-100 text-amber-900 border-2 border-amber-300'
                            }`}>
                                {feedback.status === 'correct' && <div className="bg-emerald-500 text-white rounded-full p-2"><Icon name="check" /></div>}
                                {feedback.status === 'incorrect' && <div className="bg-red-500 text-white rounded-full p-2"><Icon name="x" /></div>}
                                {feedback.status === 'hint' && <div className="bg-amber-500 text-white rounded-full p-2"><Icon name="lightbulb" /></div>}
                                
                                <p className="text-2xl font-bold flex-1">
                                    {feedback.status === 'idle' && (
                                        (currentStep === 1 && selectedStep1.length > 0) || (currentStep === 2 && selectedStep2.length > 0) ? "As-tu tout trouvé ? Vérifie !" : 
                                        currentStep === 3 ? "Touche les Noms Noyaux !" : "À toi de jouer !"
                                    )}
                                    {feedback.status !== 'idle' && feedback.message}
                                </p>
                            </div>

                            <div className="flex gap-4 w-full sm:w-auto">
                                {feedback.status === 'correct' ? (
                                    <button onClick={handleNext} className="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-5 px-10 rounded-2xl shadow-xl transform transition active:scale-95 flex items-center justify-center gap-3 text-2xl">
                                        {currentStep === 3 ? "Question" : "Étape Suivante"} <Icon name="arrowRight" className="w-8 h-8" />
                                    </button>
                                ) : (
                                    <>
                                        {(feedback.status === 'incorrect' || feedback.status === 'hint') && currentStep !== 3 && (
                                            <button onClick={showHint} className="bg-amber-200 hover:bg-amber-300 text-amber-800 font-bold p-5 rounded-2xl transition-colors shadow-sm">
                                                <Icon name="lightbulb" className="w-8 h-8" />
                                            </button>
                                        )}
                                        {currentStep !== 3 && (
                                            <button 
                                                onClick={verifyStep}
                                                disabled={(currentStep === 1 && selectedStep1.length === 0) || (currentStep === 2 && selectedStep2.length === 0)}
                                                className={`w-full sm:w-auto font-extrabold py-5 px-12 rounded-2xl shadow-xl transform transition text-2xl ${
                                                    ((currentStep === 1 && selectedStep1.length > 0) || (currentStep === 2 && selectedStep2.length > 0))
                                                        ? "bg-indigo-600 hover:bg-indigo-700 text-white active:scale-95 hover:shadow-2xl" 
                                                        : "bg-gray-200 text-gray-400 cursor-not-allowed shadow-none"
                                                }`}
                                            >
                                                Vérifier
                                            </button>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* MODAL DE RÉFLEXION (S'affiche après l'étape 3) */}
                    {showReflection && (
                        <div className="fixed inset-0 bg-indigo-900/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-50 fade-in">
                            <div className="bg-white rounded-[2rem] sm:rounded-[3rem] shadow-2xl max-w-4xl w-full p-6 sm:p-8 slide-up flex flex-col max-h-[95vh]">
                                
                                <div className="flex items-center justify-center gap-3 mb-4 sm:mb-6 shrink-0">
                                    <div className="bg-purple-100 text-purple-600 p-3 rounded-2xl">
                                        <Icon name="lightbulb" className="w-8 h-8 sm:w-10 sm:h-10" />
                                    </div>
                                    <h2 className="text-2xl sm:text-3xl font-extrabold text-gray-800">Minute de réflexion</h2>
                                </div>
                                
                                <p className="text-xl sm:text-2xl text-indigo-900 font-bold mb-6 text-center leading-snug shrink-0">
                                    {currentData.reflection.question}
                                </p>

                                <div className="overflow-y-auto no-scrollbar space-y-3 mb-6 shrink-0">
                                    {currentData.reflection.options.map((opt, idx) => {
                                        let btnClass = "w-full text-left p-4 sm:p-5 rounded-2xl sm:rounded-3xl border-4 transition-all text-lg sm:text-xl font-semibold ";
                                        
                                        // Gestion état du QCM intégré sans complexifier le state parent
                                        const isSelected = feedback.status !== 'idle' && feedback.selectedIndex === idx;
                                        
                                        if (feedback.status === 'correct' && idx === currentData.reflection.answer) {
                                            btnClass += "bg-emerald-100 border-emerald-400 text-emerald-900";
                                        } else if (feedback.status === 'incorrect' && isSelected) {
                                            btnClass += "bg-red-100 border-red-400 text-red-900";
                                        } else {
                                            btnClass += "bg-gray-50 border-gray-200 hover:bg-indigo-50 hover:border-indigo-300 text-gray-700";
                                        }

                                        return (
                                            <button 
                                                key={idx} 
                                                onClick={() => {
                                                    if (idx === currentData.reflection.answer) {
                                                        setFeedback({ status: 'correct', selectedIndex: idx });
                                                    } else {
                                                        setFeedback({ status: 'incorrect', selectedIndex: idx });
                                                    }
                                                }}
                                                disabled={feedback.status === 'correct'}
                                                className={btnClass}
                                            >
                                                <div className="flex items-center justify-between gap-4">
                                                    <span className="leading-tight">{opt}</span>
                                                    {feedback.status === 'correct' && idx === currentData.reflection.answer && <Icon name="check" className="w-6 h-6 sm:w-8 sm:h-8 text-emerald-600 flex-shrink-0" />}
                                                    {feedback.status === 'incorrect' && isSelected && <Icon name="x" className="w-6 h-6 sm:w-8 sm:h-8 text-red-600 flex-shrink-0" />}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>

                                {feedback.status === 'correct' && (
                                    <div className="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-4 sm:p-5 mb-6 fade-in shrink-0">
                                        <p className="text-emerald-900 font-medium text-lg sm:text-xl leading-snug">
                                            <strong className="block mb-1 font-extrabold">Explication :</strong>
                                            {currentData.reflection.explanation}
                                        </p>
                                    </div>
                                )}

                                <div className="flex justify-center shrink-0 mt-auto">
                                    {feedback.status === 'correct' ? (
                                        <button 
                                            onClick={handleCompleteReflection}
                                            className="bg-purple-600 hover:bg-purple-700 text-white font-extrabold py-4 px-8 rounded-full shadow-xl transition-transform active:scale-95 flex items-center gap-3 text-xl"
                                        >
                                            Continuer l'histoire <Icon name="arrowRight" className="w-6 h-6 sm:w-8 sm:h-8" />
                                        </button>
                                    ) : (
                                        <button disabled className="bg-gray-200 text-gray-400 font-bold py-4 px-8 rounded-full cursor-not-allowed text-xl">
                                            Choisis la bonne réponse
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [currentTab, setCurrentTab] = useState(1);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-gray-800 font-sans h-full w-full">
                    
                    <header className="bg-indigo-700 text-white shadow-lg z-30">
                        <div className="max-w-7xl mx-auto px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-4">
                                <div className="bg-white text-indigo-700 p-3 rounded-2xl shadow-sm">
                                    <Icon name="bookOpen" className="w-10 h-10" />
                                </div>
                                <div>
                                    <h1 className="text-3xl sm:text-4xl font-black tracking-tight">Code de Correction</h1>
                                    <p className="text-indigo-200 text-lg font-medium mt-1">L'école (4e année)</p>
                                </div>
                            </div>
                            
                            <nav className="flex space-x-2 bg-indigo-800 p-2 rounded-[2rem] w-full sm:w-auto justify-center shadow-inner">
                                <button onClick={() => setCurrentTab(1)} className={`px-8 py-3 rounded-full font-bold text-xl transition-colors flex-1 sm:flex-none ${currentTab === 1 ? 'bg-white text-indigo-800 shadow-md' : 'text-indigo-100 hover:bg-indigo-600'}`}>
                                    Méthode
                                </button>
                                <button onClick={() => setCurrentTab(2)} className={`px-8 py-3 rounded-full font-bold text-xl transition-colors flex-1 sm:flex-none ${currentTab === 2 ? 'bg-white text-indigo-800 shadow-md' : 'text-indigo-100 hover:bg-indigo-600'}`}>
                                    Simulateur
                                </button>
                            </nav>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col overflow-hidden relative w-full h-full">
                        {currentTab === 1 && <DiscoveryTab onStartSimulator={() => setCurrentTab(2)} />}
                        {currentTab === 2 && <SimulatorTab onFinish={() => setCurrentTab(1)} />}
                    </main>

                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
